<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t">
  <title id="t">Illustration of the spiral-wound RO membrane unrolling, with water flowing through its layers</title>
  <!-- Vector redraw of RETAW's brochure RO membrane illustration, in the same style as retaw-pct-cartridge.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F4FAFD"/><stop offset="1" stop-color="#E3F3FB"/>
    </linearGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="9" r="5" fill="#fff"/><circle cx="31" cy="18" r="3.5" fill="#fff"/>
      <circle cx="19" cy="36" r="4.5" fill="#fff"/><circle cx="41" cy="41" r="2.5" fill="#fff"/>
      <circle cx="24" cy="6" r="1.6" fill="#C9D9E2"/><circle cx="4" cy="30" r="1.3" fill="#C9D9E2"/>
    </pattern>
    <radialGradient id="dotFade" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".6" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1200" height="900" fill="url(#dotFade)"/></mask>

    <!-- Same greys as the PCT cartridge -->
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EEF2F4"/><stop offset="1" stop-color="#BFC9CE"/>
    </linearGradient>
    <linearGradient id="sheetBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F7F9FA"/><stop offset="1" stop-color="#C9D2D7"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D2D7"/><stop offset=".25" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#E1E7EA"/><stop offset="1" stop-color="#8E9A9F"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EEF0"/><stop offset=".45" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A9B3B8"/>
    </linearGradient>
    <linearGradient id="spacer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DD3EE"/><stop offset=".5" stop-color="#4FA9DA"/><stop offset="1" stop-color="#1F78B0"/>
    </linearGradient>
    <linearGradient id="carrier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F3FB"/><stop offset="1" stop-color="#8EC3E3"/>
    </linearGradient>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 7h14M7 0v14" stroke="#FFFFFF" stroke-width="1.4" opacity=".45"/>
    </pattern>
    <pattern id="fineMesh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 4.5h9M4.5 0v9" stroke="#8E9A9F" stroke-width=".7" opacity=".35"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE6F7" stop-opacity=".85"/><stop offset=".5" stop-color="#4FB3E3" stop-opacity=".65"/><stop offset="1" stop-color="#0479AE" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="waterLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3F3FB" stop-opacity=".2"/><stop offset=".5" stop-color="#9DD3EE" stop-opacity=".7"/><stop offset="1" stop-color="#E3F3FB" stop-opacity=".2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Background with brochure-style bubble dots -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="#E3F3FB" opacity=".55" mask="url(#dotMask)"/>
  <rect width="1200" height="900" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- Everything below is drawn along the roll axis, then tilted like the brochure -->
  <g transform="translate(760 400) rotate(-40) scale(.72)">
    <!-- Soft ground shadow -->
    <ellipse cx="-260" cy="260" rx="620" ry="70" fill="#1E2A30" opacity=".10" filter="url(#soft)"/>

    <!-- Permeate carrier sheet (back, curling down-left) -->
    <path d="M-760 120 L-10 120 C70 250 10 430 -170 520 L-920 520 C-760 430 -700 260 -760 120 Z" fill="url(#carrier)"/>
    <path d="M-760 120 L-10 120 C70 250 10 430 -170 520 L-920 520 C-760 430 -700 260 -760 120 Z" fill="url(#fineMesh)"/>

    <!-- Feed spacer mesh (back, curling up-left) -->
    <path d="M-760 -120 L-10 -120 C90 -300 30 -540 -150 -640 L-900 -640 C-720 -540 -660 -300 -760 -120 Z" fill="url(#spacer)"/>
    <path d="M-760 -120 L-10 -120 C90 -300 30 -540 -150 -640 L-900 -640 C-720 -540 -660 -300 -760 -120 Z" fill="url(#mesh)"/>
    <path d="M-150 -640 C30 -540 90 -300 -10 -120" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".6"/>

    <!-- Roll body -->
    <rect x="-760" y="-150" width="760" height="300" fill="url(#roll)"/>
    <rect x="-760" y="-150" width="760" height="300" fill="url(#fineMesh)" opacity=".6"/>
    <ellipse cx="-760" cy="0" rx="58" ry="150" fill="#A9B3B8"/>

    <!-- Membrane sheet peeling off the top of the roll -->
    <path d="M-760 -150 L0 -150 C60 -250 0 -370 -130 -420 L-880 -420 C-750 -370 -700 -250 -760 -150 Z" fill="url(#sheetBack)"/>
    <path d="M-760 -150 L0 -150 C60 -250 0 -370 -130 -420 L-880 -420 C-750 -370 -700 -250 -760 -150 Z" fill="url(#fineMesh)" opacity=".5"/>
    <path d="M-130 -420 C0 -370 60 -250 0 -150" fill="none" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Second membrane sheet folding over the front -->
    <path d="M-760 150 L0 150 C40 220 10 300 -90 330 L-850 330 C-750 300 -720 220 -760 150 Z" fill="url(#sheet)"/>
    <path d="M-90 330 C10 300 40 220 0 150" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Water flowing along the unrolled layers -->
    <path d="M-880 -520 C-700 -470 -420 -470 -240 -520 C-120 -555 -30 -500 -40 -400 C-50 -330 -150 -300 -120 -250 C-80 -300 30 -360 20 -470 C10 -590 -140 -640 -300 -600 C-520 -545 -720 -570 -880 -520 Z" fill="url(#water)"/>
    <path d="M-860 -470 C-640 -430 -420 -445 -250 -490" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".75"/>
    <path d="M-900 420 C-700 380 -460 400 -260 450 C-120 485 -20 420 -30 330 C-40 260 -120 230 -90 190 C-20 240 50 330 30 430 C10 540 -140 580 -320 540 C-520 495 -720 470 -900 420 Z" fill="url(#water)"/>
    <path d="M-880 450 C-660 420 -440 440 -270 495" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <path d="M-700 -300 C-520 -250 -300 -270 -140 -320" fill="none" stroke="url(#waterLight)" stroke-width="26" stroke-linecap="round"/>
    <path d="M-720 250 C-520 290 -300 280 -150 240" fill="none" stroke="url(#waterLight)" stroke-width="22" stroke-linecap="round"/>

    <!-- Spiral end face -->
    <ellipse cx="0" cy="0" rx="60" ry="150" fill="#E9EEF0"/>
    <g fill="none" stroke="#9AA8AE" stroke-width="3">
      <ellipse cx="0" cy="0" rx="54" ry="136"/><ellipse cx="0" cy="0" rx="47" ry="118"/>
      <ellipse cx="0" cy="0" rx="40" ry="100"/><ellipse cx="0" cy="0" rx="33" ry="82"/>
      <ellipse cx="0" cy="0" rx="26" ry="64"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".85">
      <ellipse cx="0" cy="0" rx="50" ry="127"/><ellipse cx="0" cy="0" rx="43" ry="109"/>
      <ellipse cx="0" cy="0" rx="36" ry="91"/><ellipse cx="0" cy="0" rx="29" ry="73"/>
    </g>
    <ellipse cx="0" cy="0" rx="20" ry="48" fill="#5F6E75"/>
    <ellipse cx="3" cy="0" rx="12" ry="30" fill="#2E3538"/>

    <!-- Water rings behind the tube -->
    <g fill="none" stroke-linecap="round">
      <path d="M340 -40 C300 -150 260 -220 300 -230 C350 -240 400 -130 420 -40" stroke="#4FB3E3" stroke-width="18" opacity=".45"/>
      <path d="M520 -40 C480 -140 450 -200 485 -210 C530 -220 570 -120 590 -40" stroke="#4FB3E3" stroke-width="16" opacity=".45"/>
    </g>

    <!-- Permeate collection tube -->
    <rect x="-4" y="-17" width="760" height="34" rx="17" fill="url(#tube)" stroke="#B5C0C5" stroke-width="2"/>
    <path d="M10 -9H740" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".9"/>

    <!-- Water flowing out through the tube, and rings in front -->
    <path d="M60 -26 C200 -60 330 -40 480 -20 C600 -4 700 -30 760 -28" fill="none" stroke="url(#water)" stroke-width="12" stroke-linecap="round" opacity=".7"/>
    <g fill="none" stroke-linecap="round">
      <path d="M340 -40 C360 60 400 200 350 225 C300 250 280 120 300 30" stroke="url(#water)" stroke-width="18"/>
      <path d="M340 -40 C360 60 400 200 350 225" stroke="#FFFFFF" stroke-width="4" opacity=".75"/>
      <path d="M520 -40 C540 50 575 180 530 205 C485 225 465 110 482 30" stroke="url(#water)" stroke-width="16"/>
      <path d="M520 -40 C540 50 575 180 530 205" stroke="#FFFFFF" stroke-width="4" opacity=".75"/>
    </g>

    <!-- Splashes around the end face -->
    <g fill="url(#water)">
      <path d="M40 -170 C90 -230 140 -250 170 -230 C120 -215 90 -180 60 -140 Z"/>
      <path d="M50 170 C110 220 150 250 190 240 C140 215 100 190 70 140 Z"/>
      <path d="M-20 -200 C0 -270 40 -310 70 -300 C30 -280 10 -240 5 -190 Z"/>
    </g>
    <g fill="#9DD3EE" opacity=".85">
      <ellipse cx="210" cy="-250" rx="10" ry="7"/><ellipse cx="240" cy="-190" rx="6" ry="4"/>
      <ellipse cx="230" cy="260" rx="9" ry="6"/><ellipse cx="270" cy="210" rx="5" ry="4"/>
      <ellipse cx="-980" cy="-470" rx="12" ry="8"/><ellipse cx="-1000" cy="460" rx="10" ry="7"/>
    </g>
    <g fill="#FFFFFF" opacity=".9">
      <ellipse cx="206" cy="-253" rx="3" ry="2"/><ellipse cx="226" cy="257" rx="3" ry="2"/>
    </g>
  </g>
</svg>
